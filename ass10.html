<!DOCTYPE html>
<html>
<head>
    <title>Multimedia Elements</title>

    <style>
        .output {
            border: 1px solid lightgreen;
            padding: 25px 130px;
        }

        img {
            width: 160px;
            height: 160px;
        }

        video {
            width: 207px;
            height: 120px;
        }

        audio {
            width: 160px;
        }

        iframe {
            width: 335px;
            height: 190px;
        }
    </style>
</head>

<body>

<div class="output">

    <h3>Image</h3>

    <img src="campus.jpg" alt="College campus">

    <h3>Video</h3>

    <video controls>
        <source src="video.mp4" type="video/mp4">
    </video>

    <h3>Audio</h3>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <h3>YouTube</h3>

    <iframe
        src="https://www.youtube.com/embed/VIDEO_ID"
        title="YouTube video"
        allowfullscreen>
    </iframe>

</div>

</body>
</html>
